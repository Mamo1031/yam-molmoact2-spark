# Lab configuration (serials confirmed 2026-09-30 on the DGX Spark).
# Camera roles follow the model's expected order [top, left, right] (HF model card).
# Never copy the sample serials from the reference Gist.
cameras:
  top:   { serial: "138422071505",   width: 640, height: 360, fps: 30 }
  left:  { serial: "260322279321",  width: 640, height: 360, fps: 30 }
  right: { serial: "260522272252", width: 640, height: 360, fps: 30 }

# Follower servers started by `python -m lerobot.scripts.setup_bi_yam_servers --eval`.
arms:
  host: localhost
  left_port: 1235
  right_port: 1234

# Official FastAPI server: `uv run python examples/yam/host_server_yam.py --host 127.0.0.1 --port 8202`.
policy:
  server_url: "http://127.0.0.1:8202"
  instruction: "Pick up the object and place it on the side."
  normalization_tag: "yam_dual_molmoact2"
  # num_steps: 10   # flow-matching steps; omit to use the server default

# Thresholds only raise issues in the log; nothing is clipped or sent.
checks:
  max_first_step_delta: 0.5   # rad (or gripper units) between current state and first action
  max_step_delta: 0.2         # rad between consecutive actions in a chunk

# Optional per-joint bounds. Fill from the YAM documentation once confirmed on the real arm.
# joint_limits:
#   left_joint_0: [-3.0, 3.0]
#   left_gripper: [0.0, 1.0]

# ---- Gate G5: guarded execution (scripts/run_policy_guarded.py) ----
# Rate limits are relative to the last commanded target. Absolute bounds = XML range - margin,
# intersected with the training action range. Tracking error beyond the thresholds is a FAULT.
safety:
  max_step_joint: 0.005        # rad per 30 Hz tick, common scale per arm (0.01 after the first runs)
  max_step_gripper: 0.03
  joint_margin: 0.2
  use_training_range: true
  # per dimension (left j1..j6, gripper, right j1..j6, gripper). Measured 2026-09-30: the elbow
  # (j3) lags ~0.046 rad under gravity before it starts moving (stiction), and in a box trial the
  # shoulder (j2) lagged 0.06 rad while LIFTING at 0.2 rad/s (gravity, not contact)
  # -> j1 0.08, j2 0.10, j3 0.10. Contact with the table is caught by the FK floor check.
  # 2026-10-01: gripper 0.2 -> 1.0 (= off). A gripper closing on a hard object stalls at the
  # object width while the policy keeps commanding "closed", so the error passes 0.2 within a
  # few ticks and a fault hold would have released the grip. The grip force is bounded by the follower's
  # own limiter (i2rt limit_gripper_force 50 N), not by this check. 0.2 for empty-gripper tests.
  tracking_err_max: [0.08, 0.10, 0.10, 0.10, 0.10, 0.10, 1.0,
                     0.08, 0.10, 0.10, 0.10, 0.10, 0.10, 1.0]
  # 2026-09-30: with the rate limiter the arm lags the policy's plan, so re-planned chunks start
  # 0.1-0.15 rad away from the measured pose and 0.1 rad/step is normal policy speed. The rate
  # limiter bounds the real motion; these only catch wrong state order / garbage (>0.3 rad).
  chunk_first_step_max: 0.3        # rad, joints
  chunk_step_max: 0.2
  # 2026-10-01: gripper 0.5 -> 1.0 (= off). With the gripper stalled on an object the next chunk
  # starts at "closed" while the measured value sits at the object width (gap up to ~0.9).
  chunk_first_step_max_gripper: 1.0   # gripper units (0..1)
  chunk_step_max_gripper: 1.0
  # 2026-09-30: a reach to the box moved the shoulder 0.48 rad (within training q90) and tripped
  # the 0.5 rad guard. Disabled for object runs; bounds + training range + FK floor still apply.
  start_pose_deviation_max: null
  residual_max: 0.05
  # Motor feedback read from the CAN buses (listen-only). 2026-09-30: the right shoulder tripped
  # its own over-temperature protection after ~4 min held extended (9.6 Nm, rated 9 Nm) and took
  # the whole arm down. The motor's trip point is unknown (vendor: coil <= 100 C); holding the
  # start pose alone brings a shoulder to ~55 C. Tune these from temps.csv of real runs.
  motor_temp_warn_c: 60
  motor_temp_stop_c: 70        # run/hold stop here; return-to-start is never blocked by heat
  motor_feedback_timeout_s: 0.5   # no feedback frame for this long = server not driving the arm

execution:
  # Start pose (left 7, right 7): training median (norm_stats q50). Move the arms here BY HAND.
  start_pose: [-0.073, 1.449, 1.283, -0.802, 0.113, -0.222, 0.733,
                0.082, 1.542, 1.252, -0.682, -0.129, 0.192, 0.697]
  start_pose_tolerance: 0.15
  # Table plane height in the arm base frame [m] (negative = below the base origin). MEASURE IT.
  # Leave null to disable the forward-kinematics height check (a warning is printed).
  table_z_in_base_frame: -0.014   # measured 2026-09-30: right -0.012, left -0.0138 (fingertips on table)
  # 2026-09-30: table_z was calibrated with the fingertips ON the table, so grasp_z == fingertip
  # height. 3 cm clearance forbade grasping a flat box (guard tripped at z=+0.014). 1 cm still
  # stopped every grasp of a small ball: the policy's own actions put the fingertips 0-2 cm above
  # the table when it closes the gripper, and the check is on the commanded target, which leads
  # the descending arm by 0.3-1.4 cm (so the real fingertips were still ~2 cm up). Stopping at the
  # plane still ended the attempts, so a target below table + clearance is now LIFTED onto that
  # height (smallest joint change, sideways motion kept) instead of faulting.
  min_grasp_clearance_m: 0.0
