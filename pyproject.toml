[project]
name = "molmoact2-yam-spark-tools"
version = "0.1.0"
description = "Lab tools for bringing up MolmoAct2 on bimanual YAM arms with a DGX Spark: environment checks and a no-actuation dry run."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "requests>=2.31",
    "json-numpy>=2.1",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "mujoco>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-requests",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dryrun"]

[tool.uv]
# Match the Python used for the lerobot-client venv on the Spark (pyrealsense2 has no cp311 aarch64 wheel).
python-preference = "managed"

[tool.ruff]
line-length = 100
# Spark-side helper scripts: run in the Spark venvs, not part of the package.
extend-exclude = ["spark"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
disallow_any_generics = false
warn_unused_ignores = false
ignore_missing_imports = true
files = ["dryrun", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
